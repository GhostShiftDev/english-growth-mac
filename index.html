<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Growth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand);font-size:1.1rem;">EG</div>
      <div>
        <div style="font-weight:700;font-size:1.15rem;">English Growth</div>
        <div style="opacity:0.9;font-size:0.85rem;">English learning for teachers &bull; Works fully offline</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn ghost small" id="btnSignOut" style="display:none;">Sign out</button>
    </div>
  </header>
  <main id="mainContainer"></main>
</div>

<script src="content.js"></script>
<script>
const CONTENT = window.CONTENT;
const getQuestions = window.getQuestions;

const api = window.api;
const container = document.getElementById('mainContainer');

function html(strings, ...values) {
  return strings.reduce((acc, s, i) => acc + s + (values[i] ?? ''), '');
}

async function render(viewFn, ...args) {
  container.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'view active';
  try {
    const result = viewFn(...args);
    const text = (result && typeof result.then === 'function') ? await result : result;
    el.innerHTML = (text === undefined || text === null) ? '' : text;
  } catch (err) {
    el.innerHTML = '<div class="card" style="border-left:4px solid var(--warn);"><h2>Error</h2><pre style="white-space:pre-wrap;color:var(--warn);">' + String((err && err.message) || err) + '</pre><button class="btn" data-view="lesson">Retry</button></div>';
  }
  container.appendChild(el);
  setupGlobalListeners(el);
  return el;
}

function navigate(viewFn, ...args) { render(viewFn, ...args); }

function $(sel, root = container) { return root.querySelector(sel); }
function $$(sel, root = container) { return Array.from(root.querySelectorAll(sel)); }

function on(el, ev, sel, handler) {
  el.addEventListener(ev, (e) => {
    const target = e.target.closest(sel);
    if (target) handler.call(target, e, target.dataset);
  });
}

let state = {
  groups: [],
  currentGroup: null,
  currentLevel: 'beginner',
  currentUnit: 1,
  supportLang: 'es',
};

async function loadFullState() {
  state.groups = await api.storeGet('groups') || [];
  state.supportLang = await api.storeGet('support_lang') || 'es';
}

function groupKey(g, suffix) { return `${suffix}:${g.name}`; }
function studentsKey(g) { return `students:${g.name}`; }
function doneKey(g) { return `done:${g.name}`; }
function resumeKey(g) { return `resume:${g.name}`; }
function levelKey(g) { return `level:${g.name}`; }
function attKey(g, date) { return `att:${g.name}:${date}`; }
function scoreKey(g, u) { return `score:${g.name}:${u}`; }
function scoreStKey(g, u, s) { return `score_st:${g.name}:${u}:${s}`; }

async function getGroupData(g) {
  const [students, done, resume, level] = await Promise.all([
    api.storeGet(studentsKey(g)) || [],
    api.storeGet(doneKey(g)) || [],
    api.storeGet(resumeKey(g)) || 1,
    api.storeGet(levelKey(g)) || 'beginner',
  ]);
  return { students, done, resume, level };
}

function setupGlobalListeners(el) {
  on(el, 'click', '[data-view]', (e, d) => {
    const v = d.view;
    if (v === 'login') navigate(loginView);
    else if (v === 'lesson') navigate(lessonView);
    else if (v === 'test') navigate(testView);
    else if (v === 'task') navigate(taskView);
    else if (v === 'fundamentals') navigate(fundamentalsView);
    else if (v === 'print') navigate(printView);
    else if (v === 'grouplist') navigate(groupListView);
    else if (v === 'group') navigate(groupView, d.group);
    else if (v === 'attendance') navigate(attendanceView, d.group);
    else if (v === 'students') navigate(studentListView, d.group);
    else if (v === 'unitselect') navigate(unitSelectView, d.group, d.level || 'beginner');
    else if (v === 'progress') navigate(progressView, d.group);
    else if (v === 'scores') navigate(scoresView, d.group, d.level, +d.unit);
    else if (v === 'export') navigate(exportView, d.group);
    else if (v === 'homework') navigate(homeworkView, d.group);
  });

  on(el, 'click', '[data-action]', async (e, d) => {
    switch (d.action) {
      case 'login': await doLogin(el); break;
      case 'signout': await doSignOut(); break;
      case 'attall': await doAttAll(d.group); break;
      case 'attclear': await doAttClear(d.group); break;
      case 'saveattendance': await doSaveAttendance(el, d.group); break;
      case 'addstudent': await doAddStudent(el, d.group); break;
      case 'deletestudent': await doDeleteStudent(el, d.group, d.index); break;
      case 'renamestudent': await doRenameStudent(el, d.group, d.index); break;
      case 'savemarks': await doSaveMarks(el, d.group, d.level, d.unit); break;
      case 'exportxlsx': await doExportXLSX(d.group); break;
      case 'backup': await doBackup(); break;
      case 'restore': await doRestore(); break;
      case 'printpdf': await doPrintPDF(); break;
      case 'generatehw': await doGenerateHW(d.group, d.unit); break;
    }
  });
}

// ---------- Login ----------
function loginView() {
  return html`
    <div class="card center" style="max-width:400px;margin:60px auto;">
      <div style="width:72px;height:72px;background:white;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800;color:var(--brand);font-size:1.5rem;">EG</div>
      <h2>Teacher Login</h2>
      <p style="margin-bottom:18px;color:var(--text-secondary);">Access requires teacher credentials.</p>
      <div class="form-group">
        <label>Teacher name</label>
        <input id="loginName" placeholder="Axel Garnica Estrada" value="Axel Garnica Estrada">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="loginPass" type="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" value="axel2026">
      </div>
      <div id="loginError" style="color:var(--warn);margin-bottom:12px;display:none;"></div>
      <button class="btn full" data-action="login">Sign in</button>
      <p style="margin-top:14px;font-size:0.85rem;color:var(--text-secondary);">Works fully offline &bull; No internet required</p>
    </div>
  `;
}

async function doLogin(el) {
  const name = $('#loginName', el).value.trim();
  const pass = $('#loginPass', el).value;
  const error = $('#loginError', el);
  if (name === 'Axel Garnica Estrada' && pass === 'axel2026') {
    await loadFullState();
    $('#btnSignOut').style.display = 'inline-flex';
    navigate(lessonView);
  } else {
    error.style.display = 'block';
    error.textContent = 'Invalid name or password.';
  }
}

async function doSignOut() {
  state.currentGroup = null;
  $('#btnSignOut').style.display = 'none';
  navigate(loginView);
}

// ---------- Lesson ----------
async function lessonView() {
  await loadFullState();
  const lesson = CONTENT.lesson;
  const esHtml = state.supportLang === 'es' && lesson.es
    ? html`<div style="background:var(--es-bg);border-left:4px solid var(--es);padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:0.95rem;color:var(--es);"><strong>En espa&ntilde;ol:</strong> ${lesson.es}</div>`
    : '';

  return html`
    <div class="card" style="max-width:820px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2>${lesson.title}</h2>
        <button class="btn secondary small" data-view="lesson">Restart</button>
      </div>
      ${esHtml}
      <h3>What you will learn</h3>
      <ul>${lesson.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <h3>Examples</h3>
      <ul>${lesson.examples.map(e => `<li>${e}</li>`).join('')}</ul>
      <h3>Key vocabulary</h3>
      <ul>${lesson.vocab.map(v => `<li>${v}</li>`).join('')}</ul>
      <h3>Common mistakes</h3>
      <ul>${lesson.mistakes.map(m => `<li>${m}</li>`).join('')}</ul>
      <div class="btn-row mt-24" style="gap:10px;">
        <button class="btn full success" data-view="test">Take the small test</button>
        <button class="btn full" data-view="task">View the task</button>
        <button class="btn full secondary" data-view="print">Print / Save PDF</button>
      </div>
    </div>
  `;
}

// ---------- Test ----------
async function testView() {
  const questions = getQuestions('beginner', 1);
  let idx = 0;
  let score = 0;
  let answered = false;

  const el = document.createElement('div');
  el.className = 'view active';
  el.innerHTML = html`
    <div class="card" style="max-width:640px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2>Small Test &mdash; ${CONTENT.lesson.title}</h2>
        <button class="btn secondary small" data-view="lesson">Back to lesson</button>
      </div>
      <div id="testContainer"></div>
    </div>
  `;
  container.innerHTML = '';
  container.appendChild(el);
  setupGlobalListeners(el);

  const tc = $('#testContainer', el);
  const btnPrev = document.createElement('button');
  const btnReveal = document.createElement('button');
  const btnNext = document.createElement('button');
  let questionsRef = questions;

  function buildNav() {
    btnPrev.textContent = '&lt; Prev';
    btnPrev.className = 'btn small secondary';
    btnPrev.disabled = idx === 0;
    btnReveal.textContent = 'Reveal';
    btnReveal.className = 'btn small secondary';
    btnReveal.disabled = answered;
    btnNext.textContent = answered ? 'Finish' : 'Next &gt;';
    btnNext.className = 'btn small';
    btnNext.disabled = !answered;
    btnPrev.id = 'navPrev';
    btnReveal.id = 'navReveal';
    btnNext.id = 'navNext';
    return html`<div class="test-nav">${btnPrev.outerHTML}${btnReveal.outerHTML}${btnNext.outerHTML}</div>`;
  }

  function renderQ() {
    const q = questionsRef[idx];
    const opts = q.a.map((o, i) => html`<div class="option" data-opt="${i}">${o}</div>`).join('');
    const pct = Math.round((idx / questionsRef.length) * 100);
    return html`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-size:0.85rem;color:var(--text-secondary);">Question ${idx + 1} of ${questionsRef.length}</div>
        <div class="badge ok">${pct}%</div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>
      <div class="question-card">
        <div class="q-text">${q.q}</div>
        ${opts}
      </div>
      ${buildNav()}
    `;
  }

  tc.innerHTML = renderQ();

  function mark(optEl, correct) {
    answered = true;
    questionsRef[idx];
    const q = questionsRef[idx];
    $$('.option', el).forEach(o => {
      o.disabled = true;
      if (+o.dataset.opt === q.correct) o.classList.add('correct');
      else if (e_currentTarget(o) === optEl) o.classList.add('wrong');
    });
    if (correct) score++;
    btnNext.disabled = false;
    btnReveal.disabled = true;
    btnNext.textContent = idx === questionsRef.length - 1 ? 'Finish' : 'Next &gt;';
  }

  function e_currentTarget(o) { return o; }

  on(el, 'click', '.option', (e, d) => {
    if (answered) return;
    const optIdx = +d.opt;
    const q = questionsRef[idx];
    const isCorrect = optIdx === q.correct;
    answered = true;
    if (isCorrect) score++;
    $$('.option', el).forEach(o => {
      o.disabled = true;
      if (+o.dataset.opt === q.correct) o.classList.add('correct');
      else if (o === e.currentTarget) o.classList.add('wrong');
    });
    btnNext.disabled = false;
    btnReveal.disabled = true;
    btnNext.textContent = idx === questionsRef.length - 1 ? 'Finish' : 'Next &gt;';
  });
  on(el, 'click', '#navNext', () => {
    if (idx < questionsRef.length - 1) { idx++; answered = false; tc.innerHTML = renderQ(); }
    else finishTest();
  });
  on(el, 'click', '#navPrev', () => { if (idx > 0) { idx--; answered = false; tc.innerHTML = renderQ(); } });
  on(el, 'click', '#navReveal', () => {
    if (answered) return;
    const q = questionsRef[idx];
    $$('.option', el).forEach(o => { if (+o.dataset.opt === q.correct) o.classList.add('correct'); o.disabled = true; });
    answered = true;
    btnNext.disabled = false;
    btnReveal.disabled = true;
    btnNext.textContent = idx === questionsRef.length - 1 ? 'Finish' : 'Next &gt;';
  });

  async function finishTest() {
    const pct = Math.round((score / questionsRef.length) * 100);
    const mark = Math.round((pct / 100) * 20);
    // guardar progreso (usar store directamente con un key simple)
    await api.storeSet('done:current', (await api.storeGet('done:current')) || []);
    el.innerHTML = html`
      <div class="card center" style="max-width:640px;margin:0 auto;padding:40px 24px;">
        <div style="font-size:3rem;font-weight:800;color:var(--brand);">${score}/${questionsRef.length}</div>
        <div style="font-size:1.25rem;font-weight:700;margin:8px 0;">Grade: ${mark}/20 (${pct}%)</div>
        <p style="color:var(--text-secondary);margin-top:12px;">Test completed and saved.</p>
        <div class="btn-row mt-24" style="gap:10px;justify-content:center;">
          <button class="btn" data-view="lesson">Back to lesson</button>
          <button class="btn secondary" data-view="task">Go to task</button>
        </div>
      </div>
    `;
  }
}

// ---------- Task ----------
async function taskView() {
  const task = CONTENT.task;
  return html`
    <div class="card print-area" style="max-width:720px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Task &mdash; ${CONTENT.lesson.title}</h2>
        <button class="btn secondary small no-print" data-view="lesson">Back</button>
      </div>
      <h3>Tasks</h3>
      <ul>${task.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
      <h3>Word bank</h3>
      <p>${task.wordBank.join(', ')}</p>
      <h3>Writing</h3>
      <p>${task.writing}</p>
      <h3>Speaking</h3>
      <p>${task.speaking}</p>
      <div class="btn-row mt-24" style="gap:10px;">
        <button class="btn full" style="background:transparent;border:2px dashed var(--divider);color:var(--text-secondary);" onclick="this.nextElementSibling.style.display='block';this.style.display='none';">Show answers</button>
        <div style="display:none;background:var(--ok-bg);padding:12px;border-radius:8px;color:var(--ok);font-weight:700;">${task.answers.join(', ')}</div>
      </div>
    </div>
  `;
}

// ---------- Fundamentals ----------
async function fundamentalsView() { return html`<div class="card"><h2>Fundamentals</h2><p>Coming soon.</p><button class="btn" data-view="lesson">Back to lesson</button></div>`; }

// ---------- Progress / Homework / Scores / Export ----------
async function progressView(groupName) { return html`<div class="card"><h2>Progress</h2><p>Coming soon.</p><button class="btn" data-view="lesson">Back to lesson</button></div>`; }
async function homeworkView(groupName) { return html`<div class="card"><h2>Homework</h2><p>Coming soon.</p><button class="btn" data-view="lesson">Back to lesson</button></div>`; }
async function scoresView(groupName, levelId, unitN) { return html`<div class="card"><h2>Marks</h2><p>Coming soon.</p><button class="btn" data-view="lesson">Back to lesson</button></div>`; }
async function exportView(groupName) { return html`<div class="card"><h2>Export</h2><p>Coming soon.</p><button class="btn" data-view="lesson">Back to lesson</button></div>`; }

// ---------- Print ----------
async function printView() {
  const lesson = CONTENT.lesson;
  const htmlContent = html`
    <div class="print-area">
      <h2 style="border-bottom:2px solid var(--brand);padding-bottom:6px;">English Growth &mdash; Lesson</h2>
      <div style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px;">Level: ${CONTENT.lesson.title}</div>
      <h3>${lesson.title}</h3>
      <ul>${lesson.examples.map(e => `<li>${e}</li>`).join('')}</ul>
    </div>
  `;
  const pdfPath = await api.printPDF(htmlContent, `EnglishGrowth_${CONTENT.lesson.title.replace(/[^a-z0-9]/gi, '_')}.pdf`);
  alert(`PDF saved to:\n${pdfPath}`);
  navigate(lessonView);
}

// ---------- Boot ----------
navigate(lessonView);
</script>
</body>
</html>
