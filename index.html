<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Growth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand);font-size:1.1rem;">EG</div>
      <div>
        <div style="font-weight:700;font-size:1.15rem;">English Growth</div>
        <div style="opacity:0.9;font-size:0.85rem;">English learning for teachers &bull; Works fully offline</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="appVersion" style="font-size:0.78rem;opacity:0.85;">v1.0.1</span>
      <button class="btn ghost small" id="btnSignOut" style="display:none;">Sign out</button>
    </div>
  </header>
  <main id="mainContainer">
    <div class="card center" style="max-width:420px;margin:60px auto;">
      <h2>Starting&hellip;</h2>
      <p>If this message stays on screen, the app interface could not start.</p>
    </div>
  </main>
</div>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- setup
  var C = window.CONTENT;
  var buildQuestions = window.getQuestions;
  var container = document.getElementById('mainContainer');
  var signOutBtn = document.getElementById('btnSignOut');
  var versionEl = document.getElementById('appVersion');
  var nativeApi = window.api;

  if (C && C.version && versionEl) versionEl.textContent = 'v' + C.version;

  // Fallback de almacenamiento: si el preload fallara, la app sigue funcionando.
  function lsGet(key) {
    try {
      var raw = window.localStorage.getItem('eg:' + key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { window.localStorage.setItem('eg:' + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  var api = {
    storeGet: function (key) {
      if (nativeApi && typeof nativeApi.storeGet === 'function') {
        return nativeApi.storeGet(key).then(function (v) {
          return (v === undefined || v === null) ? lsGet(key) : v;
        })['catch'](function () { return lsGet(key); });
      }
      return Promise.resolve(lsGet(key));
    },
    storeSet: function (key, value) {
      if (nativeApi && typeof nativeApi.storeSet === 'function') {
        return nativeApi.storeSet(key, value)['catch'](function () { return lsSet(key, value); });
      }
      return Promise.resolve(lsSet(key, value));
    },
    printPDF: function (html, filename) {
      if (nativeApi && typeof nativeApi.printPDF === 'function') {
        return nativeApi.printPDF(html, filename);
      }
      return Promise.resolve(null);
    }
  };

  // ---------------------------------------------------------------- utils
  function html(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, s, i) {
      var v = values[i];
      return acc + s + (v === undefined || v === null ? '' : v);
    }, '');
  }

  function esc(v) {
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function $(sel, root) { return (root || container).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || container).querySelectorAll(sel)); }

  function on(root, ev, sel, handler) {
    root.addEventListener(ev, function (e) {
      var target = e.target && e.target.closest ? e.target.closest(sel) : null;
      if (target && root.contains(target)) handler.call(target, e, target.dataset);
    });
  }

  function errorCard(message) {
    return '<div class="card" style="max-width:680px;margin:40px auto;border-left:4px solid var(--warn);">' +
      '<h2 style="color:var(--warn);">Error</h2>' +
      '<pre style="white-space:pre-wrap;font-size:0.85rem;background:var(--bg);padding:12px;border-radius:8px;color:var(--warn);">' +
      esc(message || 'Unknown error') +
      '</pre>' +
      '<button class="btn" data-view="login">Back to login</button>' +
      '</div>';
  }

  // ---------------------------------------------------------------- render
  async function render(viewFn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!container) throw new Error('mainContainer not found');
    container.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'view active';
    try {
      var result = viewFn.apply(null, args);
      var text = (result && typeof result.then === 'function') ? await result : result;
      el.innerHTML = (text === undefined || text === null) ? '' : text;
    } catch (err) {
      el.innerHTML = errorCard((err && err.message) || err);
    }
    container.appendChild(el);
    return el;
  }

  function navigate(viewFn) {
    return render.apply(null, arguments);
  }

  // ---------------------------------------------------------------- state
  var state = {
    groups: [],
    supportLang: 'es'
  };

  async function loadFullState() {
    try {
      var groups = await api.storeGet('groups');
      var lang = await api.storeGet('support_lang');
      state.groups = groups || [];
      state.supportLang = lang || 'es';
    } catch (e) {
      // la app funciona igual sin preferencias guardadas
      state.groups = state.groups || [];
      state.supportLang = state.supportLang || 'es';
    }
  }

  // ---------------------------------------------------------------- listeners
  on(document, 'click', '[data-view]', function (e, d) {
    var v = d.view;
    if (v === 'login') navigate(loginView);
    else if (v === 'lesson') navigate(lessonView);
    else if (v === 'test') navigate(testView);
    else if (v === 'task') navigate(taskView);
    else if (v === 'print') navigate(printView);
  });

  on(document, 'click', '[data-action]', function (e, d) {
    if (d.action === 'login') doLogin(e.target.closest('.view') || container);
  });

  if (signOutBtn) {
    signOutBtn.addEventListener('click', function () { doSignOut(); });
  }

  // ---------------------------------------------------------------- login
  function loginView() {
    return html`
      <div class="card center" style="max-width:420px;margin:50px auto;">
        <div style="width:72px;height:72px;background:var(--brand-light);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800;color:var(--brand);font-size:1.5rem;">EG</div>
        <h2>Teacher Login</h2>
        <p style="margin-bottom:18px;">Access requires teacher credentials.</p>
        <div class="form-group" style="text-align:left;">
          <label for="loginName">Teacher name</label>
          <input id="loginName" autocomplete="username" value="Axel Garnica Estrada">
        </div>
        <div class="form-group" style="text-align:left;">
          <label for="loginPass">Password</label>
          <input id="loginPass" type="password" autocomplete="current-password" value="axel2026">
        </div>
        <div id="loginError" style="color:var(--warn);margin-bottom:12px;display:none;"></div>
        <button class="btn full" data-action="login">Sign in</button>
        <p style="margin-top:14px;font-size:0.85rem;">Works fully offline &bull; No internet required</p>
      </div>
    `;
  }

  async function doLogin(root) {
    var nameEl = $('#loginName', root);
    var passEl = $('#loginPass', root);
    var errEl = $('#loginError', root);
    var name = nameEl ? nameEl.value.trim() : '';
    var pass = passEl ? passEl.value : '';

    if (name === 'Axel Garnica Estrada' && pass === 'axel2026') {
      try { await loadFullState(); } catch (e) { /* no bloquea el login */ }
      if (signOutBtn) signOutBtn.style.display = 'inline-flex';
      navigate(lessonView);
    } else if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = 'Invalid name or password.';
    }
  }

  function doSignOut() {
    if (signOutBtn) signOutBtn.style.display = 'none';
    navigate(loginView);
  }

  // ---------------------------------------------------------------- lesson
  function lessonView() {
    var lesson = C.lesson;
    var esHtml = (lesson.es)
      ? html`<div style="background:var(--es-bg);border-left:4px solid var(--es);padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:0.95rem;color:var(--es);"><strong>En espa&ntilde;ol:</strong> ${lesson.es}</div>`
      : '';

    function list(items) {
      return '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }

    return html`
      <div class="card" style="max-width:820px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;">
          <h2 style="margin-bottom:0;">${lesson.title}</h2>
          <button class="btn secondary small" data-view="lesson">Restart</button>
        </div>
        ${esHtml}
        <h3>What you will learn</h3>
        ${list(lesson.points)}
        <h3>Examples</h3>
        ${list(lesson.examples)}
        <h3>Key vocabulary</h3>
        <p>${lesson.vocab.map(esc).join(' &bull; ')}</p>
        <h3>Common mistakes</h3>
        ${list(lesson.mistakes)}
        <div class="btn-row mt-24" style="gap:10px;">
          <button class="btn full success" data-view="test">Take the small test</button>
          <button class="btn full" data-view="task">View the task</button>
          <button class="btn full secondary" data-view="print">Print / Save PDF</button>
        </div>
      </div>
    `;
  }

  // ---------------------------------------------------------------- test
  function testView() {
    var questions = (typeof buildQuestions === 'function') ? buildQuestions('beginner', 1) : (C.questions || []);
    var idx = 0;
    var score = 0;
    var answered = false;

    var el = document.createElement('div');
    el.className = 'view active';
    el.innerHTML = html`
      <div class="card" style="max-width:660px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;">
          <h2 style="margin-bottom:0;">Small Test</h2>
          <button class="btn secondary small" data-view="lesson">Back to lesson</button>
        </div>
        <div id="testContainer"></div>
      </div>
    `;
    container.innerHTML = '';
    container.appendChild(el);

    var tc = $('#testContainer', el);

    function renderQ() {
      var q = questions[idx];
      var opts = q.a.map(function (o, i) {
        return '<div class="option" data-opt="' + i + '">' + esc(o) + '</div>';
      }).join('');
      var pct = Math.round((idx / questions.length) * 100);
      return html`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="font-size:0.85rem;color:var(--text-secondary);">Question ${idx + 1} of ${questions.length}</div>
          <div class="badge ok">${pct}%</div>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>
        <div class="question-card" style="margin-top:16px;">
          <div class="q-text">${esc(q.q)}</div>
          ${opts}
        </div>
        <div class="test-nav">
          <button class="btn small secondary" id="navPrev" ${idx === 0 ? 'disabled' : ''}>&lt; Prev</button>
          <button class="btn small secondary" id="navReveal" ${answered ? 'disabled' : ''}>Reveal</button>
          <button class="btn small" id="navNext" ${answered ? '' : 'disabled'}>${idx === questions.length - 1 ? 'Finish' : 'Next &gt;'}</button>
        </div>
      `;
    }

    function lockOptions(chosen) {
      $$('.option', el).forEach(function (o) {
        o.classList.add('locked');
        if (+o.dataset.opt === questions[idx].correct) o.classList.add('correct');
        else if (chosen && +o.dataset.opt === +chosen.dataset.opt) o.classList.add('wrong');
      });
      var next = $('#navNext', el);
      var reveal = $('#navReveal', el);
      if (next) {
        next.disabled = false;
        next.textContent = idx === questions.length - 1 ? 'Finish' : 'Next >';
      }
      if (reveal) reveal.disabled = true;
    }

    tc.innerHTML = renderQ();

    on(el, 'click', '.option', function (e, d) {
      if (answered) return;
      answered = true;
      var optIdx = +d.opt;
      if (optIdx === questions[idx].correct) score++;
      lockOptions(this);
    });

    on(el, 'click', '#navReveal', function () {
      if (answered) return;
      answered = true;
      lockOptions(null);
    });

    on(el, 'click', '#navNext', function () {
      if (!answered) return;
      if (idx < questions.length - 1) {
        idx++;
        answered = false;
        tc.innerHTML = renderQ();
      } else {
        finishTest();
      }
    });

    on(el, 'click', '#navPrev', function () {
      if (idx > 0) {
        idx--;
        answered = false;
        tc.innerHTML = renderQ();
      }
    });

    async function finishTest() {
      var pct = Math.round((score / questions.length) * 100);
      var mark = Math.round((pct / 100) * 20);
      try {
        var done = await api.storeGet('done:current');
        done = done || [];
        done.push({ date: new Date().toISOString(), score: score, total: questions.length, mark: mark });
        await api.storeSet('done:current', done);
      } catch (e) { /* guardar no es obligatorio */ }

      el.innerHTML = html`
        <div class="card center" style="max-width:660px;margin:0 auto;padding:36px 24px;">
          <div style="font-size:3rem;font-weight:800;color:var(--brand);">${score}/${questions.length}</div>
          <div style="font-size:1.25rem;font-weight:700;margin:8px 0;">Grade: ${mark}/20 (${pct}%)</div>
          <p style="margin-top:12px;">Test completed.</p>
          <div class="btn-row mt-24" style="gap:10px;justify-content:center;">
            <button class="btn" data-view="lesson">Back to lesson</button>
            <button class="btn secondary" data-view="task">Go to task</button>
          </div>
        </div>
      `;
    }
  }

  // ---------------------------------------------------------------- task
  function taskView() {
    var task = C.task;
    function list(items) {
      return '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    return html`
      <div class="card print-area" style="max-width:760px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;">
          <h2 style="margin-bottom:0;">Task &mdash; ${esc(C.lesson.title)}</h2>
          <button class="btn secondary small no-print" data-view="lesson">Back</button>
        </div>
        <h3>Exercises</h3>
        ${list(task.tasks)}
        <h3>Word bank</h3>
        <p>${task.wordBank.map(esc).join(' &bull; ')}</p>
        <h3>Writing</h3>
        <p>${esc(task.writing)}</p>
        <h3>Speaking</h3>
        <p>${esc(task.speaking)}</p>
        <div class="btn-row mt-24 no-print">
          <button class="btn full" id="btnShowAnswers" style="background:transparent;border:2px dashed var(--divider);color:var(--text-secondary);">Show answers</button>
          <div id="taskAnswers" style="display:none;background:var(--ok-bg);padding:12px;border-radius:8px;color:var(--ok);">
            ${task.answers.map(function (a) { return '<div style="margin:4px 0;">' + esc(a) + '</div>'; }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  on(document, 'click', '#btnShowAnswers', function () {
    var box = document.getElementById('taskAnswers');
    var btn = document.getElementById('btnShowAnswers');
    if (box) box.style.display = 'block';
    if (btn) btn.style.display = 'none';
  });

  // ---------------------------------------------------------------- print
  async function printView() {
    var lesson = C.lesson;
    var doc = html`
      <div>
        <h2 style="border-bottom:2px solid #0E7C86;padding-bottom:6px;">English Growth &mdash; Lesson</h2>
        <div style="font-size:0.9rem;color:#555;margin-bottom:16px;">${esc(lesson.title)}</div>
        <h3>${esc(lesson.title)}</h3>
        <ul>${lesson.examples.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('')}</ul>
        <h3>Task</h3>
        <ul>${C.task.tasks.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('')}</ul>
      </div>
    `;
    try {
      var pdfPath = await api.printPDF(doc, 'EnglishGrowth_Lesson_Asking_the_Time.pdf');
      if (pdfPath) alert('PDF saved to:\n' + pdfPath);
      else alert('Printing is available only in the installed app.');
    } catch (e) {
      alert('Could not create the PDF: ' + ((e && e.message) || e));
    }
    navigate(lessonView);
  }

  // ---------------------------------------------------------------- boot
  if (!C || !C.lesson) {
    container.innerHTML = errorCard('Content could not be loaded (content.js).');
    window.__EG_BOOTED__ = true;
    return;
  }

  navigate(loginView);
  window.__EG_BOOTED__ = true;
})();
</script>
<script>
// Red de seguridad: si el script principal fallara al compilar/ejecutar,
// mostramos un mensaje visible en lugar de dejar solo el header.
(function () {
  window.addEventListener('error', function (e) {
    window.__EG_LAST_ERROR__ = e.message || String(e.error || 'script error');
  });
  window.setTimeout(function () {
    if (window.__EG_BOOTED__) return;
    var c = document.getElementById('mainContainer');
    if (!c) return;
    c.innerHTML =
      '<div class="card" style="max-width:680px;margin:40px auto;border-left:4px solid #d32f2f;">' +
      '<h2 style="color:#d32f2f;">Startup error (v1.0.1)</h2>' +
      '<p>The interface could not start. This is usually a script error.</p>' +
      '<pre style="white-space:pre-wrap;font-size:12px;background:#f7f7f7;padding:10px;border-radius:8px;">' +
      (window.__EG_LAST_ERROR__ || 'No details available.') +
      '</pre>' +
      '<button class="btn" onclick="location.reload()">Retry</button>' +
      '</div>';
  }, 900);
})();
</script>
</body>
</html>
