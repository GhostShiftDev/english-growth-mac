<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Growth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><img src="build/icon.png" alt="English Growth" height="32" width="32"></div>
      <div>
        <div class="brand-name">English Growth</div>
        <div class="brand-sub">Aprende inglés</div>
      </div>
    </div>

    <nav id="topnav" class="topnav">
      <button class="navbtn" data-view="lesson">Lección</button>
      <button class="navbtn" data-view="test">Test</button>
      <button class="navbtn" data-view="task">Tarea</button>
      <button class="navbtn" data-view="groups">Grupos</button>
      <button class="navbtn" data-view="reports">Reportes</button>
    </nav>

    <div class="header-right">
      <span id="appVersion" class="version">v1.1.0</span>
      <button class="btn ghost small" id="btnSignOut" style="display:none;">Salir</button>
    </div>
  </header>
  <main id="mainContainer">
    <div class="card center" style="max-width:420px;margin:60px auto;">
      <h2>Cargando&hellip;</h2>
      <p>Si este mensaje permanece, la interfaz no pudo iniciar.</p>
    </div>
  </main>
</div>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  // ================================================================ setup
  var EG = window.EG_CONTENT;
  var container = document.getElementById('mainContainer');
  var topnav = document.getElementById('topnav');
  var signOutBtn = document.getElementById('btnSignOut');
  var versionEl = document.getElementById('appVersion');
  var nativeApi = window.api;

  var DATA_KEY = 'eg_data';
  var data = null;
  var currentViewName = 'login';
  var activeLessonId = (EG && EG.lessons && EG.lessons[0]) ? EG.lessons[0].id : null;
  var lastReport = null;
  var saveTimer = null;
  var toastTimer = null;

  if (EG && EG.app && EG.app.version && versionEl) versionEl.textContent = 'v' + EG.app.version;

  var ui = {
    groupTab: {},
    attDate: {},
    hwDate: {},
    report: {
      groupId: '',
      mode: 'month',
      day: todayStr(),
      month: monthStr()
    }
  };

  // ================================================================ api
  function lsGet(key) {
    try {
      var raw = window.localStorage.getItem('eg:' + key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { window.localStorage.setItem('eg:' + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  function downloadFallback(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return filename;
  }

  function sheetsToCsv(sheets) {
    var lines = [];
    sheets.forEach(function (sheet) {
      lines.push('### ' + sheet.name);
      sheet.data.forEach(function (row) {
        lines.push(row.map(function (cell) {
          return '"' + String(cell === undefined || cell === null ? '' : cell).replace(/"/g, '""') + '"';
        }).join(','));
      });
      lines.push('');
    });
    return lines.join('\r\n');
  }

  var api = {
    storeGet: function (key) {
      if (nativeApi && typeof nativeApi.storeGet === 'function') {
        return nativeApi.storeGet(key).then(function (v) {
          return (v === undefined || v === null) ? lsGet(key) : v;
        })['catch'](function () { return lsGet(key); });
      }
      return Promise.resolve(lsGet(key));
    },
    storeSet: function (key, value) {
      if (nativeApi && typeof nativeApi.storeSet === 'function') {
        return nativeApi.storeSet(key, value)['catch'](function () { return lsSet(key, value); });
      }
      return Promise.resolve(lsSet(key, value));
    },
    printPDF: function (html, filename) {
      if (nativeApi && typeof nativeApi.printPDF === 'function') return nativeApi.printPDF(html, filename);
      return Promise.resolve(null);
    },
    exportXLSX: function (filename, sheets) {
      if (nativeApi && typeof nativeApi.exportXLSX === 'function') return nativeApi.exportXLSX(filename, sheets);
      return Promise.resolve(downloadFallback(filename.replace(/\.xlsx$/i, '.csv'), sheetsToCsv(sheets), 'text/csv;charset=utf-8;'));
    },
    saveFile: function (defaultName, mimeType, contents) {
      if (nativeApi && typeof nativeApi.saveFile === 'function') return nativeApi.saveFile(defaultName, mimeType, contents);
      return Promise.resolve(downloadFallback(defaultName, contents, mimeType));
    },
    openFile: function () {
      if (nativeApi && typeof nativeApi.openFile === 'function') return nativeApi.openFile();
      return Promise.resolve(null);
    },
    openDataDir: function () {
      if (nativeApi && typeof nativeApi.openDataDir === 'function') return nativeApi.openDataDir();
      return Promise.resolve(null);
    }
  };

  // ================================================================ utils
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function monthStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function esc(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function html(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, s, i) {
      var v = values[i];
      return acc + s + (v === undefined || v === null ? '' : v);
    }, '');
  }
  function $(sel, root) { return (root || container).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || container).querySelectorAll(sel)); }
  function safeFile(name) {
    return String(name).replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '') || 'reporte';
  }
  function formatDateHuman(day) {
    var p = String(day).split('-');
    if (p.length !== 3) return day;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  // ================================================================ data
  function blankData() {
    return {
      schemaVersion: 2,
      createdAt: new Date().toISOString(),
      updatedAt: null,
      groups: [],
      attendance: {},
      homework: {},
      testResults: [],
      settings: {}
    };
  }

  function normalizeStudent(raw, i) {
    var st = (raw && typeof raw === 'object') ? raw : { name: String(raw || '') };
    var out = Object.assign({}, st);
    out.id = out.id || uid('s');
    out.name = String(out.name || ('Alumno ' + (i + 1))).trim();
    out.createdAt = out.createdAt || new Date().toISOString();
    return out;
  }

  function normalizeGroup(raw, i) {
    var g = (raw && typeof raw === 'object') ? raw : { name: String(raw || '') };
    var out = Object.assign({}, g);
    out.id = out.id || uid('g');
    out.name = String(out.name || ('Grupo ' + (i + 1))).trim();
    out.createdAt = out.createdAt || new Date().toISOString();
    out.students = Array.isArray(out.students) ? out.students.map(normalizeStudent) : [];
    return out;
  }

  // Conserva cualquier campo desconocido para no romper datos de versiones futuras.
  function normalizeData(raw) {
    var input = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    var out = Object.assign({}, blankData(), input);
    out.schemaVersion = Math.max(2, Number(input.schemaVersion) || 0);
    out.groups = Array.isArray(input.groups) ? input.groups.map(normalizeGroup) : [];
    out.attendance = (input.attendance && typeof input.attendance === 'object') ? input.attendance : {};
    out.homework = (input.homework && typeof input.homework === 'object') ? input.homework : {};
    out.testResults = Array.isArray(input.testResults) ? input.testResults : [];
    out.settings = (input.settings && typeof input.settings === 'object') ? input.settings : {};
    out.createdAt = out.createdAt || new Date().toISOString();
    return out;
  }

  function loadData() {
    return api.storeGet(DATA_KEY).then(function (raw) {
      data = normalizeData(raw);
      if (!raw) {
        return api.storeGet('groups').then(function (legacy) {
          if (Array.isArray(legacy) && legacy.length) {
            data.groups = legacy.map(normalizeGroup);
          }
          return saveData(true);
        })['catch'](function () { return saveData(true); });
      }
      return data;
    });
  }

  function saveData(silent) {
    data.updatedAt = new Date().toISOString();
    return api.storeSet(DATA_KEY, data).then(function () {
      if (!silent) markSaved();
      return true;
    })['catch'](function (err) {
      toast('No se pudo guardar: ' + ((err && err.message) || err), true);
      return false;
    });
  }

  function markSaved() {
    var el = document.getElementById('saveState');
    if (el) {
      el.textContent = 'Guardado ✓';
      el.classList.add('ok');
    }
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(function () {
      var e = document.getElementById('saveState');
      if (e) { e.textContent = 'Guardado automáticamente'; e.classList.remove('ok'); }
    }, 1600);
  }

  function findGroup(gid) {
    if (!data) return null;
    for (var i = 0; i < data.groups.length; i++) if (data.groups[i].id === gid) return data.groups[i];
    return null;
  }
  function findStudent(group, sid) {
    if (!group) return null;
    for (var i = 0; i < group.students.length; i++) if (group.students[i].id === sid) return group.students[i];
    return null;
  }

  function recordFor(kind, gid, day, create) {
    var root = kind === 'attendance' ? data.attendance : data.homework;
    if (!root[gid]) {
      if (!create) return null;
      root[gid] = {};
    }
    if (!root[gid][day]) {
      if (!create) return null;
      root[gid][day] = {};
    }
    return root[gid][day];
  }

  function hasOwn(obj, key) {
    return !!obj && Object.prototype.hasOwnProperty.call(obj, key);
  }

  function monthStats(gid, sid) {
    var month = monthStr();
    var att = data.attendance[gid] || {};
    var hw = data.homework[gid] || {};
    var present = 0, homework = 0;
    Object.keys(att).forEach(function (day) {
      if (day.indexOf(month) === 0 && att[day] && att[day][sid] === true) present++;
    });
    Object.keys(hw).forEach(function (day) {
      if (day.indexOf(month) === 0 && hw[day] && hw[day][sid] === true) homework++;
    });
    return { present: present, homework: homework };
  }

  // ================================================================ ui helpers
  function toast(message, isError) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { el.className = 'toast'; }, 2600);
  }

  function closeDialog() {
    var d = document.getElementById('egDialog');
    if (d) d.remove();
  }

  function openDialog(opts) {
    closeDialog();
    var overlay = document.createElement('div');
    overlay.id = 'egDialog';
    overlay.className = 'dialog-overlay';
    overlay.innerHTML =
      '<div class="dialog">' +
        '<h3>' + esc(opts.title) + '</h3>' +
        (opts.message ? '<p>' + esc(opts.message) + '</p>' : '') +
        (opts.inputValue !== undefined ? '<input id="dlgInput" value="' + esc(opts.inputValue) + '">' : '') +
        '<div class="actions">' +
          '<button class="btn secondary" data-dlg="cancel">Cancelar</button>' +
          '<button class="btn ' + (opts.danger ? 'danger' : '') + '" data-dlg="ok">' + esc(opts.okLabel || 'Aceptar') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    function finish(ok) {
      if (!ok) { closeDialog(); return; }
      var input = overlay.querySelector('#dlgInput');
      var value = input ? input.value.trim() : undefined;
      if (input && !value) { toast('Escribe un nombre.', true); input.focus(); return; }
      var result = opts.onOk ? opts.onOk(value) : true;
      if (result !== false) closeDialog();
    }

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.closest('[data-dlg="cancel"]')) finish(false);
      else if (e.target.closest('[data-dlg="ok"]')) finish(true);
    });

    var dlgInput = overlay.querySelector('#dlgInput');
    if (dlgInput) {
      dlgInput.focus();
      dlgInput.select();
      dlgInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      });
    }
  }

  function errorCard(message) {
    return '<div class="card" style="max-width:680px;margin:40px auto;border-left:4px solid var(--warn);">' +
      '<h2 style="color:var(--warn);">Error</h2>' +
      '<pre class="error-pre">' + esc(message) + '</pre>' +
      '<button class="btn" data-view="lesson">Volver</button>' +
      '</div>';
  }

  // ================================================================ render
  async function render(viewFn) {
    var args = Array.prototype.slice.call(arguments, 1);
    container.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'view active';
    try {
      var result = viewFn.apply(null, args);
      var text = (result && typeof result.then === 'function') ? await result : result;
      el.innerHTML = (text === undefined || text === null) ? '' : text;
    } catch (err) {
      el.innerHTML = errorCard((err && err.message) || err);
    }
    container.appendChild(el);
    return el;
  }

  var views = {};

  function navigate(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    var fn = views[name];
    if (!fn) { toast('Vista no encontrada: ' + name, true); return; }
    currentViewName = name;
    setActiveNav(name);
    return render.apply(null, [fn].concat(args));
  }

  function setActiveNav(name) {
    var map = { lesson: 'lesson', test: 'test', task: 'task', groups: 'groups', group: 'groups', reports: 'reports', print: 'lesson' };
    var key = map[name] || '';
    Array.prototype.forEach.call(document.querySelectorAll('.navbtn'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-view') === key);
    });
  }

  function showShell(show) {
    if (topnav) topnav.style.display = show ? 'flex' : 'none';
    if (signOutBtn) signOutBtn.style.display = show ? 'inline-flex' : 'none';
  }

  // ================================================================ login
  function loginView() {
    return html`
      <div class="card center" style="max-width:430px;margin:50px auto;">
        <div class="login-logo"><img src="build/icon.png" alt="English Growth" height="32" width="32"></div>
        <h2>Acceso del profesor</h2>
        <p style="margin-bottom:18px;">Ingresa con tus credenciales para continuar.</p>
        <div class="form-group" style="text-align:left;">
          <label for="loginName">Nombre del profesor</label>
          <input id="loginName" autocomplete="username" value="Axel Garnica Estrada">
        </div>
        <div class="form-group" style="text-align:left;">
          <label for="loginPass">Contraseña</label>
          <input id="loginPass" type="password" autocomplete="current-password" value="axel2026">
        </div>
        <div id="loginError" class="form-error" style="display:none;"></div>
        <button class="btn full" data-action="login">Entrar</button>
        <p style="margin-top:14px;font-size:0.85rem;">Funciona sin conexión &bull; No necesita internet</p>
      </div>
    `;
  }

  async function doLogin(root) {
    var nameEl = $('#loginName', root);
    var passEl = $('#loginPass', root);
    var errEl = $('#loginError', root);
    var name = nameEl ? nameEl.value.trim() : '';
    var pass = passEl ? passEl.value : '';

    if (name === 'Axel Garnica Estrada' && pass === 'axel2026') {
      try { await loadData(); } catch (e) { data = normalizeData(null); }
      showShell(true);
      toast('Bienvenido, Axel');
      navigate('lesson');
    } else if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = 'Nombre o contraseña incorrectos.';
    }
  }

  function doSignOut() {
    showShell(false);
    navigate('login');
  }

  // ================================================================ lesson
  function lessonView() {
    var lesson = EG.getLesson(activeLessonId);
    var intro = lesson.introEs
      ? '<div class="es-box"><strong>En español:</strong> ' + esc(lesson.introEs) + '</div>'
      : '';

    function bullets(items) {
      return '<ul class="lesson-list">' + items.map(function (item) {
        return '<li>' +
          (item.es ? '<span class="es-text">' + esc(item.es) + '</span> ' : '') +
          (item.en ? '<span class="en-phrase">&ldquo;' + esc(item.en) + '&rdquo;</span>' : '') +
          '</li>';
      }).join('') + '</ul>';
    }

    var vocabRows = lesson.vocab.map(function (v) {
      return '<tr>' +
        '<td class="en-cell">' + esc(v.en) + '</td>' +
        '<td>' + esc(v.es) + '</td>' +
        '<td class="phon-en">' + (v.phonEn ? esc(v.phonEn) : '') + '</td>' +
      '</tr>';
    }).join('');

    return html`
      <div class="card" style="max-width:860px;margin:0 auto;">
        <div class="lesson-head">
          <div>
            <div class="eyebrow">Lección ${lesson.unit} &bull; Inglés</div>
            <h2 style="margin-bottom:2px;">${esc(lesson.titleEs)}</h2>
            <div class="lesson-title-en">${esc(lesson.titleEn)}</div>
          </div>
          <span class="pill">Objetivo: pedir y decir la hora</span>
        </div>
        <p class="objective">${esc(lesson.objectiveEs)}</p>
        ${intro}

        <h3>Lo que vas a aprender</h3>
        ${bullets(lesson.points)}

        <h3>Ejemplos</h3>
        ${bullets(lesson.examples)}

        <h3>Vocabulario clave</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Inglés</th><th>Español</th></tr></thead>
            <tbody>${vocabRows}</tbody>
          </table>
        </div>

        <h3>Errores comunes</h3>
        ${bullets(lesson.mistakes)}

        <div class="btn-row mt-24">
          <button class="btn success" data-view="test">Hacer el test</button>
          <button class="btn" data-view="task">Ver la tarea</button>
          <button class="btn secondary" data-view="print">Imprimir / Guardar PDF</button>
        </div>
      </div>
    `;
  }

  // ================================================================ test
  function testView() {
    var lesson = EG.getLesson(activeLessonId);
    var questions = EG.getQuestions(activeLessonId);
    var idx = 0;
    var score = 0;
    var answered = false;

    var el = document.createElement('div');
    el.className = 'view active';
    el.innerHTML = html`
      <div class="card" style="max-width:680px;margin:0 auto;">
        <div class="lesson-head">
          <div>
            <div class="eyebrow">Test de la lección</div>
            <h2 style="margin-bottom:0;">${esc(lesson.titleEs)}</h2>
          </div>
          <button class="btn secondary small" data-view="lesson">Volver a la lección</button>
        </div>
        <div id="testContainer"></div>
      </div>
    `;
    container.innerHTML = '';
    container.appendChild(el);

    var tc = $('#testContainer', el);

    function renderQ() {
      var q = questions[idx];
      var opts = q.a.map(function (o, i) {
        return '<div class="option" data-opt="' + i + '">' + esc(o) + '</div>';
      }).join('');
      var pct = Math.round((idx / questions.length) * 100);
      return html`
        <div class="question-meta">
          <span>Pregunta ${idx + 1} de ${questions.length}</span>
          <span class="badge ok">${pct}%</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>
        <div class="question-card" style="margin-top:16px;">
          <div class="q-text">${esc(q.q)}</div>
          ${opts}
        </div>
        <div class="test-nav">
          <button class="btn small secondary" id="navPrev" ${idx === 0 ? 'disabled' : ''}>Anterior</button>
          <button class="btn small secondary" id="navReveal" ${answered ? 'disabled' : ''}>Ver respuesta</button>
          <button class="btn small" id="navNext" ${answered ? '' : 'disabled'}>${idx === questions.length - 1 ? 'Terminar' : 'Siguiente'}</button>
        </div>
      `;
    }

    function lockOptions(chosenOpt) {
      $$('.option', el).forEach(function (o) {
        o.classList.add('locked');
        if (+o.dataset.opt === questions[idx].correct) o.classList.add('correct');
        else if (chosenOpt && o === chosenOpt) o.classList.add('wrong');
      });
      var next = $('#navNext', el);
      var reveal = $('#navReveal', el);
      if (next) {
        next.disabled = false;
        next.textContent = idx === questions.length - 1 ? 'Terminar' : 'Siguiente';
      }
      if (reveal) reveal.disabled = true;
    }

    tc.innerHTML = renderQ();

    el.addEventListener('click', function (e) {
      var opt = e.target.closest ? e.target.closest('.option') : null;
      if (opt && el.contains(opt)) {
        if (answered) return;
        answered = true;
        if (+opt.dataset.opt === questions[idx].correct) score++;
        lockOptions(opt);
        return;
      }
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      if (btn.id === 'navReveal' && !answered) {
        answered = true;
        lockOptions(null);
      } else if (btn.id === 'navNext' && answered) {
        if (idx < questions.length - 1) {
          idx++;
          answered = false;
          tc.innerHTML = renderQ();
        } else {
          finishTest();
        }
      } else if (btn.id === 'navPrev' && idx > 0) {
        idx--;
        answered = false;
        tc.innerHTML = renderQ();
      }
    });

    async function finishTest() {
      var pct = Math.round((score / questions.length) * 100);
      var mark = Math.round((pct / 100) * 20);
      try {
        data.testResults.push({
          lessonId: activeLessonId,
          date: new Date().toISOString(),
          score: score,
          total: questions.length,
          mark: mark
        });
        await saveData(true);
      } catch (e) { /* el resultado no bloquea */ }

      el.innerHTML = html`
        <div class="card center" style="padding:36px 24px;">
          <div class="eyebrow">Resultado</div>
          <div class="score-big">${score}/${questions.length}</div>
          <div class="score-grade">Calificación: ${mark}/20 (${pct}%)</div>
          <p style="margin-top:12px;">Test completado. El resultado quedó guardado.</p>
          <div class="btn-row mt-24" style="justify-content:center;">
            <button class="btn" data-view="lesson">Volver a la lección</button>
            <button class="btn secondary" data-view="task">Ir a la tarea</button>
          </div>
        </div>
      `;
    }
  }

  // ================================================================ task
  function taskView() {
    var lesson = EG.getLesson(activeLessonId);
    var task = lesson.task;

    var exercises = task.exercises.map(function (ex) {

  // ================================================================ reports
  function reportPeriod() {
    return ui.report.mode === 'day' ? ui.report.day : ui.report.month;
  }
  function reportKey() {
    return [ui.report.groupId || 'all', ui.report.mode, reportPeriod()].join('|');
  }

  function buildReport(opts) {
    var groups = opts.groupId ? [findGroup(opts.groupId)] : data.groups.slice();
    groups = groups.filter(Boolean);

    var days = [];
    if (opts.mode === 'day') {
      days = [opts.period];
    } else {
      var year = +opts.period.slice(0, 4);
      var month = +opts.period.slice(5, 7);
      var totalDays = new Date(year, month, 0).getDate();
      for (var d = 1; d <= totalDays; d++) days.push(opts.period + '-' + pad(d));
    }

    var resumen = [['Grupo', 'Alumno', 'Días con asistencia', 'Asistencias', 'Faltas', '% Asistencia', 'Tareas entregadas', 'Tareas pendientes', '% Tareas']];
    var asistencia = [['Fecha', 'Grupo', 'Alumno', 'Estado']];
    var tareas = [['Fecha', 'Grupo', 'Alumno', 'Estado']];
    var fechas = [['Fecha', 'Grupo', 'Asistencia guardada', 'Tareas guardadas', 'Presentes', 'Entregaron']];
    var totals = { present: 0, absent: 0, hwDone: 0, hwPending: 0, students: 0, groups: groups.length, records: 0 };
    var summary = [];

    groups.forEach(function (group) {
      var perStudent = {};
      group.students.forEach(function (st) {
        perStudent[st.id] = { attDays: 0, present: 0, absent: 0, hwDays: 0, hwDone: 0, hwPending: 0 };
        totals.students++;
      });

      days.forEach(function (day) {
        var attRec = data.attendance[group.id] && data.attendance[group.id][day];
        var hwRec = data.homework[group.id] && data.homework[group.id][day];
        if (!attRec && !hwRec) {
          if (opts.mode === 'month') return;
        } else {
          totals.records++;
        }

        var presentCount = 0, hwCount = 0;

        group.students.forEach(function (st) {
          var attKnown = hasOwn(attRec, st.id);
          var hwKnown = hasOwn(hwRec, st.id);

          var attState = attKnown ? (attRec[st.id] === true ? 'Presente' : 'Ausente') : 'Sin registro';
          var hwState = hwKnown ? (hwRec[st.id] === true ? 'Entregó' : 'Pendiente') : 'Sin registro';

          asistencia.push([day, group.name, st.name, attState]);
          tareas.push([day, group.name, st.name, hwState]);

          var ps = perStudent[st.id];
          if (attKnown) {
            ps.attDays++;
            if (attRec[st.id] === true) { ps.present++; presentCount++; totals.present++; }
            else { ps.absent++; totals.absent++; }
          }
          if (hwKnown) {
            ps.hwDays++;
            if (hwRec[st.id] === true) { ps.hwDone++; hwCount++; totals.hwDone++; }
            else { ps.hwPending++; totals.hwPending++; }
          }
        });

        fechas.push([day, group.name, attRec ? 'Sí' : 'No', hwRec ? 'Sí' : 'No', presentCount, hwCount]);
      });

      group.students.forEach(function (st) {
        var ps = perStudent[st.id];
        var attPct = ps.attDays ? Math.round((ps.present / ps.attDays) * 100) : '';
        var hwPct = ps.hwDays ? Math.round((ps.hwDone / ps.hwDays) * 100) : '';
        resumen.push([group.name, st.name, ps.attDays, ps.present, ps.absent, attPct, ps.hwDone, ps.hwPending, hwPct]);
        summary.push({
          group: group.name, student: st.name,
          attDays: ps.attDays, present: ps.present, absent: ps.absent, attPct: attPct,
          hwDone: ps.hwDone, hwPending: ps.hwPending, hwPct: hwPct
        });
      });
    });

    return {
      key: reportKey(),
      resumen: resumen,
      asistencia: asistencia,
      tareas: tareas,
      fechas: fechas,
      summary: summary,
      totals: totals
    };
  }

          <p>Los datos se guardan en tu Mac. Puedes exportar un respaldo y restaurarlo cuando quieras; agregar lecciones nuevas no borra la información.</p>
          <div class="btn-row">

  async function doReportExcel() {
    if (!data.groups.length) { toast('Primero crea un grupo.', true); return; }
    var report = buildReport({
      groupId: ui.report.groupId,
      mode: ui.report.mode,
      period: reportPeriod()
    });
    lastReport = report;

    var groupName = ui.report.groupId ? (findGroup(ui.report.groupId) || {}).name : 'Todos_los_grupos';
    var filename = 'Reporte_' + safeFile(groupName) + '_' + reportPeriod() + '.xlsx';

    try {
      var path = await api.exportXLSX(filename, [
        { name: 'Resumen', data: report.resumen },
        { name: 'Asistencia', data: report.asistencia },
        { name: 'Tareas', data: report.tareas },
        { name: 'Fechas', data: report.fechas }
      ]);
      if (path) {
        toast('Excel generado');
        window.alert('Reporte guardado en:\n' + path);
      } else {
        toast('Exportación cancelada');
      }
    } catch (err) {
      toast('No se pudo generar el Excel: ' + ((err && err.message) || err), true);
    }
    navigate('reports');
  }

    try {
      var text = await api.openFile();
      if (!text) { toast('La restauración solo está disponible en la app instalada.'); return; }
      var parsed;
      try { parsed = JSON.parse(text); }
      catch (e) { toast('El archivo no es un respaldo válido.', true); return; }
      openDialog({
        title: 'Restaurar respaldo',
        message: 'Se reemplazarán los grupos, alumnos, asistencias y tareas actuales por los del respaldo. ¿Continuar?',
        okLabel: 'Restaurar',
        danger: true,
        onOk: async function () {
          data = normalizeData(parsed);
          await saveData(true);
          lastReport = null;
          toast('Respaldo restaurado');
          navigate('groups');
        }
      });
    } catch (err) {
      toast('No se pudo restaurar: ' + ((err && err.message) || err), true);
    }
  }

  async function doOpenDataDir() {
    var p = await api.openDataDir();
    if (!p) toast('Solo disponible en la app instalada.');
  }

  // ================================================================ print
  async function printView() {
    var lesson = EG.getLesson(activeLessonId);
    var doc = html`
      <div>
        <h2 style="border-bottom:2px solid #0E7C86;padding-bottom:6px;">English Growth - ${esc(lesson.titleEs)}</h2>
        <p style="color:#555;margin:0 0 14px;">${esc(lesson.titleEn)}</p>
        <p><strong>En español:</strong> ${esc(lesson.introEs)}</p>
        <h3>Lo que vas a aprender</h3>
        <ul>${lesson.points.map(function (p) { return '<li>' + esc(p.es) + (p.en ? ' <strong>"' + esc(p.en) + '"</strong>' : '') + '</li>'; }).join('')}</ul>
        <h3>Ejemplos</h3>
        <ul>${lesson.examples.map(function (e) { return '<li>' + esc(e.es) + ' <strong>"' + esc(e.en) + '"</strong></li>'; }).join('')}</ul>
        <h3>Tarea</h3>
        <ul>${lesson.task.exercises.map(function (t) { return '<li>' + esc(t.es) + (t.en ? ' <strong>"' + esc(t.en) + '"</strong>' : '') + '</li>'; }).join('')}</ul>
      </div>
    `;
    try {
      var pdfPath = await api.printPDF(doc, 'EnglishGrowth_' + safeFile(lesson.titleEs) + '.pdf');
      if (pdfPath) window.alert('PDF guardado en:\n' + pdfPath);
      else window.alert('La impresión está disponible solo en la app instalada.');
    } catch (err) {
      window.alert('No se pudo crear el PDF: ' + ((err && err.message) || err));
    }
    navigate('lesson');
  }

  // ================================================================ events
  document.addEventListener('click', function (e) {
    var viewBtn = e.target.closest ? e.target.closest('[data-view]') : null;
    if (viewBtn) {
      var view = viewBtn.getAttribute('data-view');
      if (views[view]) navigate(view);
      return;
    }

    var actionBtn = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!actionBtn) return;
    var action = actionBtn.getAttribute('data-action');
    var gid = actionBtn.getAttribute('data-gid');
    var sid = actionBtn.getAttribute('data-sid');

    if (action === 'login') doLogin(actionBtn.closest('.view') || container);
    else if (action === 'groupcreate') doGroupCreate();
    else if (action === 'groupopen') doGroupOpen(gid);
    else if (action === 'grouprename') doGroupRename(gid);
    else if (action === 'groupdelete') doGroupDelete(gid);
    else if (action === 'studentadd') doStudentAdd(gid);
    else if (action === 'studentrename') doStudentRename(gid, sid);
    else if (action === 'studentdelete') doStudentDelete(gid, sid);
    else if (action === 'grouptab') doGroupTab(gid, actionBtn.getAttribute('data-tab'));
    else if (action === 'attall') doSetAll(gid, 'attendance', true);
    else if (action === 'attclear') doSetAll(gid, 'attendance', false);
    else if (action === 'hwall') doSetAll(gid, 'homework', true);
    else if (action === 'hwclear') doSetAll(gid, 'homework', false);
    else if (action === 'reportpreview') doReportPreview();
    else if (action === 'reportexcel') doReportExcel();
    else if (action === 'backup') doBackup();
    else if (action === 'restore') doRestore();
    else if (action === 'opendatadir') doOpenDataDir();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el) return;

    if (el.type === 'checkbox' && (el.getAttribute('data-role') === 'att' || el.getAttribute('data-role') === 'hw')) {
      doToggleRecord(el);
      return;
    }

    if (el.getAttribute('data-role') === 'att-date') {
      ui.attDate[el.getAttribute('data-gid')] = el.value;
      navigate('group', el.getAttribute('data-gid'));
      return;
    }
    if (el.getAttribute('data-role') === 'hw-date') {
      ui.hwDate[el.getAttribute('data-gid')] = el.value;
      navigate('group', el.getAttribute('data-gid'));
      return;
    }

    if (el.id === 'repGroup') { ui.report.groupId = el.value; lastReport = null; navigate('reports'); return; }
    if (el.id === 'repMode') { ui.report.mode = el.value; lastReport = null; navigate('reports'); return; }
    if (el.id === 'repDay') { ui.report.day = el.value || todayStr(); lastReport = null; return; }
    if (el.id === 'repMonth') { ui.report.month = el.value || monthStr(); lastReport = null; return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDialog(); return; }
    if (e.key !== 'Enter' || !e.target) return;
    if (e.target.id === 'newGroupName') { e.preventDefault(); doGroupCreate(); }
    else if (e.target.id === 'newStudentName') {
      e.preventDefault();
      doStudentAdd(e.target.getAttribute('data-gid'));
    } else if (e.target.id === 'loginPass') {
      e.preventDefault();
      var signIn = document.querySelector('[data-action="login"]');
      if (signIn) signIn.click();
    }
  });

  document.addEventListener('click', function (e) {
    var showAnswers = e.target.closest ? e.target.closest('#btnShowAnswers') : null;
    if (showAnswers) {
      var box = document.getElementById('taskAnswers');
      if (box) box.style.display = 'block';
      showAnswers.style.display = 'none';
    }
  });

  if (signOutBtn) signOutBtn.addEventListener('click', doSignOut);

  // ================================================================ boot
  views = {
    login: loginView,
    lesson: lessonView,
    test: testView,
    task: taskView,
    groups: groupsView,
    group: groupDetailView,
    reports: reportsView,
    print: printView
  };

  // Hook de diagnóstico (solo se usa desde el navegador de pruebas).
  window.__EG_DEBUG__ = {
    buildReport: buildReport,
    getData: function () { return data; },
    setReport: function (opts) {
      if (opts.groupId !== undefined) ui.report.groupId = opts.groupId;
      if (opts.mode !== undefined) ui.report.mode = opts.mode;
      if (opts.day !== undefined) ui.report.day = opts.day;
      if (opts.month !== undefined) ui.report.month = opts.month;
    },
    navigate: navigate
  };

  if (!EG || !EG.lessons || !EG.lessons.length) {
    container.innerHTML = errorCard('No se pudo cargar el contenido (content.js).');
    window.__EG_BOOTED__ = true;
    return;
  }

  data = normalizeData(null);
  showShell(false);
  navigate('login');
  window.__EG_BOOTED__ = true;
})();
</script>
<script>
// Red de seguridad: si el script principal no arrancara, mostrar el error en pantalla.
(function () {
  window.addEventListener('error', function (e) {
    window.__EG_LAST_ERROR__ = e.message || String(e.error || 'script error');
  });
  window.setTimeout(function () {
    if (window.__EG_BOOTED__) return;
    var c = document.getElementById('mainContainer');
    if (!c) return;
    c.innerHTML =
      '<div class="card" style="max-width:680px;margin:40px auto;border-left:4px solid #d32f2f;">' +
      '<h2 style="color:#d32f2f;">Error al iniciar (v1.1.0)</h2>' +
      '<p>La interfaz no pudo iniciar. Suele ser un error de script.</p>' +
      '<pre class="error-pre">' + (window.__EG_LAST_ERROR__ || 'Sin detalles disponibles.') + '</pre>' +
      '<button class="btn" onclick="location.reload()">Reintentar</button>' +
      '</div>';
  }, 900);
})();
</script>
</body>
</html>
